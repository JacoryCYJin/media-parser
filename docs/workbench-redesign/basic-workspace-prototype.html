nk',emptyMediaDesc:'Source information and download formats will appear here.',emptyStt:'Make your audio readable',emptySttDesc:'Add an audio source to start a transcription.',emptyOutline:'Give your text a clear structure',emptyOutlineDesc:'Paste or import text to create a readable outline.',saveAt:'Save to',download:'Download',downloadAudio:'Download audio',videoOnly:'Video',audioOnly:'Audio only',resolved:'Resolved source',sampleTitle:'Rediscovering creativity in everyday life',samplePodcast:'Slow Notes · A conversation about focus and creativity',sampleMeta:'Example source · 18:42 · Interaction demo only',preview:'Audio preview',previewNote:'Layout preview: no real audio loaded',inputText:'Source text',textPlaceholder:'Paste a transcript, subtitles or your own notes…',titlePlaceholder:'Add a title (optional)',import:'Import text',outputLanguage:'Output language',generate:'Generate outline',textMin:'Enter at least 100 non-whitespace characters.',full:'Full text',segments:'Timestamps',result:'Result',copy:'Copy',export:'Export text',summaryTitle:'Creativity through observation and practice',summaryText:'This material explores how everyday observation, focused attention and small steps support a sustainable creative practice.',chapter1:'01  Rethinking creativity',chapter1Body:'Creativity goes beyond sudden inspiration. Notice everyday questions and record observations as a starting point.',chapter2:'02  Making room for focus',chapter2Body:'Reduce context switching and give one problem your full attention. Capture ideas without starting every task at once.',chapter3:'03  Taking a small first step',chapter3Body:'Finish a manageable exercise, gather feedback and adapt. Consistent practice matters more than waiting for perfect conditions.',transcript:'Creativity is not just an occasional flash of inspiration. It often comes from observing everyday life. When we pause to record a question or look at a familiar thing in a different way, the creative process has already begun.\n\nFocus is another essential condition. Constant task switching prevents ideas from taking shape. Set aside an uninterrupted period for a single task, and capture passing ideas to consider later.\n\nFinally, begin with a small action: a paragraph or a simple exercise. Complete it, listen to feedback and gradually adjust your rhythm. Creative work develops through action, rather than waiting until everything is perfectly ready.',running:'Processing',parsing:'Resolving',downloading:'Downloading',transcribing:'Transcribing',generating:'Generating',paused:'Paused',completed:'Completed',failed:'Failed',cancelled:'Stopped',pause:'Pause',resume:'Resume',stop:'Stop',retry:'Retry',openFolder:'Show in folder',demo:'Demo controls',demoHelp:'Manually change task states to inspect each scenario.',finish:'Simulate success',fail:'Simulate failure',history:'Recent tasks',restore:'View',historyEmpty:'No previous tasks',failure:'Simulated failure. Your input is preserved; retry when ready.',invalidUrl:'Enter a valid HTTP or HTTPS URL.',missing:'Add an input source first.',wrongAudio:'Choose a supported audio file.',wrongText:'Choose a TXT, MD or SRT text file (up to 2 MB).',copied:'Copied',copyFallback:'Clipboard unavailable. Select and copy the result text manually.',folderHint:'This prototype does not create media files or open real folders.',settingsNote:'Prototype settings affect this page only. No real cookies, accounts or model configuration are accessed.',uiLanguage:'Interface language',folder:'Default download folder (demo)',model:'Outline model name (demo)',close:'Done',session:'State stays in this browser session',change:'Change',ready:'Ready',stoppedDesc:'Task stopped. Inputs and previous results are preserved.'}};
let lang='zh',page='home',folder='~/Downloads/Media Parser',model='My model',serial=0,toastTimer;
const t=k=>words[lang][k]||k,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({id:++serial,url:'',text:'',title:'',mode:'file',file:'',audioKind:'video',recognition:'auto',outputLang:'zh',status:'idle',operation:'',progress:0,resolved:false,error:'',result:'',view:'full',history:[]});
const states={video:fresh(),podcast:fresh(),stt:fresh(),outline:fresh()};
const busy=s=>['running','paused'].includes(s.status);
const B=(label,action,icon='',cls='',disabled=false)=>`<button type="button" class="btn ${cls}" data-action="${action}" ${disabled?'disabled':''}>${icon?I(icon):''}${t(label)}</button>`;
function notify(key){const el=document.getElementById('toast');el.textContent=t(key);el.className='toast';el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
function tiles(){return ['video','podcast','stt','outline'].map((k,n)=>`<button class="module ${k}" data-action="go:${k}"><span class="module-icon">${I(k)}</span><span class="blocks" aria-hidden="true">${[0,1,2,3,4,5].map(i=>`<i class="${[[0,2],[0,1],[2,3],[0,5]][n].includes(i)?'blank':''}"></i>`).join('')}</span><h2>${t(k)}</h2><p>${t(k+'Desc')}</p><span class="arrow">${I('arrow')}</span></button>`).join('')}
function home(){return `<div class="home-head"><div><p class="eyebrow">${t('workspace')}</p><h1>${t('welcome')}</h1><p class="sub">${t('intro')}</p></div><span class="count">${t('modules')}</span></div><div class="module-grid">${tiles()}</div><div class="home-foot"><span>${t('homeNote')}</span><span>${t('homeEnd')}</span></div>`}
function status(s){if(s.status==='idle'||s.status==='ready')return '';const running=s.status==='running',label=running?({parse:'parsing',download:'downloading',stt:'transcribing',outline:'generating'}[s.operation]):s.status;return `<div class="status-box ${s.status==='failed'?'failed':''}" role="status"><div class="row"><span class="status-title grow">${t(label)}</span>${running||s.status==='paused'?`<span>${s.progress}%</span>`:I(s.status==='completed'?'check':'clock')}</div><p class="status-desc">${t(s.status==='failed'?'failure':s.status==='cancelled'?'stoppedDesc':'demoNote')}</p>${running||s.status==='paused'?`<div class="progress"><i style="width:${s.progress}%"></i></div>`:''}<div class="row" style="margin-top:12px">${running&&s.operation==='download'?B('pause','pause','','small'):''}${s.status==='paused'?B('resume','resume','','small'):''}${busy(s)?B('stop','stop','','small'):''}${['failed','cancelled'].includes(s.status)?B('retry','retry','','small'):''}${s.status==='completed'&&s.operation==='download'?B('openFolder','folder','folder','small'):''}</div></div>`}
function empty(k){const name=k==='video'||k==='podcast'?'Media':k==='stt'?'Stt':'Outline';return `<div class="empty">${I(k)}<h3>${t('empty'+name)}</h3><p>${t('empty'+name+'Desc')}</p></div>`}
function sourceInput(s){return `<div class="input-row">${I('link')}<input aria-label="${t('url')}" data-field="url" value="${esc(s.url)}" placeholder="${t('url')}" ${busy(s)?'disabled':''}>${B('parse','parse','arrow','primary',busy(s))}</div><div class="helper"><button class="link" data-action="example" ${busy(s)?'disabled':''}>${t('example')}</button></div>`}
function mediaPage(s,k){return `<div class="input-panel">${sourceInput(s)}${s.error?`<p class="error" role="alert">${t(s.error)}</p>`:''}</div>${s.resolved?`<section class="section"><div class="section-head"><h2>${t('resolved')}</h2><span class="meta">${t('prototype')}</span></div><div class="media-head"><div class="cover">${I(k)}</div><div><h2>${t(k==='video'?'sampleTitle':'samplePodcast')}</h2><p>${t('sampleMeta')}</p></div></div>${k==='podcast'?`<audio class="audio" controls aria-label="${t('preview')}"></audio><p class="helper">${t('previewNote')}</p>`:''}<div class="controls">${k==='video'?`<div class="tabs" style="margin:0"><button class="tab ${s.audioKind==='video'?'on':''}" data-action="format:video" ${busy(s)?'disabled':''}>${t('videoOnly')}</button><button class="tab ${s.audioKind==='audio'?'on':''}" data-action="format:audio" ${busy(s)?'disabled':''}>${t('audioOnly')}</button></div>`:`<span class="control-label">${t('audioOnly')}</span>`}<span class="control-label">${t('saveAt')} <span>${esc(folder)}</span></span></div>${(k==='podcast'?['MP3 · 128 kbps']:s.audioKind==='audio'?['M4A · 128 kbps']:['MP4 · 1080p','MP4 · 720p']).map(f=>`<div class="format">${I(k==='podcast'||s.audioKind==='audio'?'stt':'video')}<div class="grow"><strong>${f}</strong><p>${t('prototype')} · ${k==='podcast'?'18.6 MB':s.audioKind==='audio'?'17.8 MB':f.includes('1080')?'142 MB':'78 MB'}</p></div>${B('download','download:'+f,'download','',busy(s))}</div>`).join('')}</section>`:!busy(s)&&s.status==='idle'?empty(k):''}${status(s)}`}
function sttPage(s){return `<div class="input-panel"><div class="tabs"><button class="tab ${s.mode==='file'?'on':''}" data-action="mode:file" ${busy(s)?'disabled':''}>${t('audioFile')}</button><button class="tab ${s.mode==='url'?'on':''}" data-action="mode:url" ${busy(s)?'disabled':''}>${t('sourceLink')}</button></div>${s.mode==='file'?s.file?`<div class="file-line">${I('file')}<span class="grow">${esc(s.file)}</span>${B('change','pickAudio','','small',busy(s))}</div>`:`<button class="drop" data-action="pickAudio" id="drop" ${busy(s)?'disabled':''}>${I('upload')}<strong>${t('drop')}</strong><p>${t('formats')}</p></button>`:`<div class="input-row">${I('link')}<input data-field="url" aria-label="${t('url')}" value="${esc(s.url)}" placeholder="${t('url')}" ${busy(s)?'disabled':''}></div>`}<input id="audio-file" type="file" accept=".mp3,.m4a,.wav,.flac,.ogg" hidden><div class="helper"><button class="link" data-action="example" ${busy(s)?'disabled':''}>${t('example')}</button></div><div class="controls"><label class="control-label">${t('language')}<select class="select" data-field="recognition" ${busy(s)?'disabled':''}>${['auto','zh','en'].map(v=>`<option value="${v}" ${s.recognition===v?'selected':''}>${t(v)}</option>`).join('')}</select></label>${B('start','start','arrow','primary',busy(s))}</div><details class="advanced"><summary>${t('advanced')}</summary><p>${t('advancedNote')}</p></details>${s.error?`<p class="error" role="alert">${t(s.error)}</p>`:''}</div>${status(s)}${s.result?textResult(s):s.status==='idle'?empty('stt'):''}`}
function outlinePage(s){return `<div class="input-panel"><input class="title-input" data-field="title" aria-label="${t('titlePlaceholder')}" placeholder="${t('titlePlaceholder')}" value="${esc(s.title)}" ${busy(s)?'disabled':''}><label class="field-label" for="source-text">${t('inputText')}</label><textarea id="source-text" class="text-input" data-field="text" placeholder="${t('textPlaceholder')}" ${busy(s)?'disabled':''}>${esc(s.text)}</textarea><div class="row" style="margin-top:12px">${B('import','pickText','file','small',busy(s))}<button class="link" data-action="example" ${busy(s)?'disabled':''}>${t('example')}</button></div><input id="text-file" type="file" accept=".txt,.md,.srt" hidden><div class="controls"><label class="control-label">${t('outputLanguage')}<select class="select" data-field="outputLang" ${busy(s)?'disabled':''}>${['zh','en'].map(v=>`<option value="${v}" ${s.outputLang===v?'selected':''}>${t(v)}</option>`).join('')}</select></label>${B('generate','generate','arrow','primary',busy(s))}</div>${s.error?`<p class="error" role="alert">${t(s.error)}</p>`:''}</div>${status(s)}${s.result?outlineResult(s):s.status==='idle'?empty('outline'):''}`}
function resultHead(s){return `<div class="section-head"><h2>${t('result')}</h2><div class="row">${B('copy','copy','','small')}${B('export','export','download','small')}</div></div>`}
function textResult(s){return `<section class="result">${resultHead(s)}<div class="tabs"><button class="tab ${s.view==='full'?'on':''}" data-action="result:full">${t('full')}</button><button class="tab ${s.view==='segments'?'on':''}" data-action="result:segments">${t('segments')}</button></div><pre tabindex="0">${esc(s.view==='full'?s.result:s.result.split('\n\n').map((v,i)=>['00:00 — 00:28','00:28 — 01:02','01:02 — 01:35'][i]+'\n'+v).join('\n\n'))}</pre></section>`}
function outlineResult(s){const w=words[s.resultLang||'zh'];return `<section class="result">${resultHead(s)}<h3>${esc(s.resultTitle)}</h3><p class="summary">${w.summaryText}</p>${[1,2,3].map(n=>`<details open><summary>${w['chapter'+n]}</summary><p>${w['chapter'+n+'Body']}</p></details>`).join('')}</section>`}
function tool(k){const s=states[k];return `<button class="back" data-action="go:home">${I('back')}${t('back')}</button><header class="tool-head"><div class="tool-title">${I(k)}<div><h1>${t(k)}</h1><p class="sub">${t(k+'Desc')}</p></div></div>${B('new','new','plus','',busy(s))}</header>${k==='stt'?sttPage(s):k==='outline'?outlinePage(s):mediaPage(s,k)}<details class="history"><summary>${t('history')} · ${s.history.length}</summary>${s.history.length?s.history.map((h,i)=>`<div class="history-item"><button data-action="restore:${i}" ${busy(s)?'disabled':''}>${esc(h.file||h.title||h.url||t(k))}</button><span>${t(h.status)}</span></div>`).join(''):`<p class="helper">${t('historyEmpty')}</p>`}</details><details class="demo-panel" open><summary>${t('demo')}</summary><p class="helper">${t('demoHelp')}</p><div class="row">${B('finish','finish','','small',s.status!=='running')}${B('fail','fail','','small',s.status!=='running')}</div></details>`}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">${I('grid')}<span>Media Parser</span></div><div class="side-label">${t('tools')}</div><button class="nav-button active" data-action="go:home" title="${t('workspace')}">${I('grid')}<span>${t('workspace')}</span></button><div class="side-bottom"><button class="nav-button" data-action="settings" title="${t('settings')}">${I('settings')}<span>${t('settings')}</span></button><div class="local-note"><i class="dot"></i>${t('local')}</div></div></aside><div class="shell"><header class="topbar"><div class="crumb">${page==='home'?`<span>${t('workspace')}</span>`:`<button data-action="go:home">${t('workspace')}</button><span style="color:#bbb">/</span><span>${t(page)}</span>`}</div><span class="badge">${t('prototype')}</span></header><main class="main"><div class="content">${page==='home'?home():tool(page)}</div></main><footer class="footer"><span>${t('demoNote')}</span><span>${t('session')}</span></footer></div></div>`;bindFiles()}
function validUrl(x){try{return ['http:','https:'].includes(new URL(x).protocol)}catch{return false}}
function start(s,op){s.error='';if(op==='parse'||(op==='stt'&&s.mode==='url')){if(!validUrl(s.url.trim())){s.error='invalidUrl';render();return}}if(op==='stt'&&s.mode==='file'&&!s.file){s.error='missing';render();return}if(op==='outline'&&s.text.replace(/\s/g,'').length<100){s.error='textMin';render();return}if(op==='parse'){s.resolved=false;s.result=''}s.operation=op;s.status='running';s.progress=12;render()}
function finish(s){if(s.status!=='running')return;s.progress=100;s.status='completed';if(s.operation==='parse'){s.resolved=true;s.status='ready'}if(s.operation==='stt')s.result=words[s.recognition==='auto'?lang:s.recognition].transcript;if(s.operation==='outline'){s.resultLang=s.outputLang;s.resultTitle=s.title.trim()||words[s.outputLang].summaryTitle;s.result=[s.resultTitle,words[s.outputLang].summaryText,...[1,2,3].flatMap(n=>[words[s.outputLang]['chapter'+n],words[s.outputLang]['chapter'+n+'Body']])].join('\n\n')}render()}
function settings(){const d=document.getElementById('settings');d.innerHTML=`<div class="section-head"><h2>${t('settings')}</h2></div><p class="helper">${t('settingsNote')}</p><div class="setting"><label for="ui-lang">${t('uiLanguage')}</label><select class="select" id="ui-lang"><option value="zh" ${lang==='zh'?'selected':''}>简体中文</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></div><div class="setting"><label for="folder-value">${t('folder')}</label><input id="folder-value" value="${esc(folder)}"></div><div class="setting"><label for="model-value">${t('model')}</label><input id="model-value" value="${esc(model)}"></div><div class="row" style="justify-content:flex-end;margin-top:20px">${B('close','closeSettings','','primary')}</div>`;d.showModal();d.querySelector('#ui-lang').onchange=e=>{folder=d.querySelector('#folder-value').value;model=d.querySelector('#model-value').value;lang=e.target.value;render();d.close();settings()}}
function acceptAudio(f){if(!f)return;const s=states.stt;if(busy(s))return;if(!/\.(mp3|m4a|wav|flac|ogg)$/i.test(f.name)){s.error='wrongAudio'}else{s.file=f.name;s.error='';s.status='idle';s.result=''}render()}
function bindFiles(){const audio=document.getElementById('audio-file');if(audio)audio.onchange=e=>acceptAudio(e.target.files[0]);const drop=document.getElementById('drop');if(drop){drop.ondragover=e=>{e.preventDefault();drop.classList.add('dragover')};drop.ondragleave=()=>drop.classList.remove('dragover');drop.ondrop=e=>{e.preventDefault();acceptAudio(e.dataTransfer.files[0])}}const text=document.getElementById('text-file');if(text)text.onchange=async e=>{const f=e.target.files[0],s=states.outline;if(!f||busy(s))return;if(!/\.(txt|md|srt)$/i.test(f.name)||f.size>2*1024*1024){s.error='wrongText';render();return}try{s.text=await f.text();s.title=f.name.replace(/\.[^.]+$/,'');s.error='';s.result='';s.status='idle';render()}catch{s.error='wrongText';render()}}}
document.addEventListener('input',e=>{const key=e.target.dataset.field;if(key&&states[page]){const s=states[page];s[key]=e.target.value;if(!busy(s)){s.error='';s.status='idle';s.result='';if(key==='url'){s.resolved=false;document.querySelector('.section')?.remove()}document.querySelector('.result')?.remove();document.querySelector('.status-box')?.remove()}}});
document.addEventListener('change',e=>{if(e.target.dataset.field&&e.target.tagName==='SELECT')render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.field==='url'&&['video','podcast'].includes(page)){e.preventDefault();if(!busy(states[page]))start(states[page],'parse')}});
document.addEventListener('click',async e=>{const target=e.target.closest('[data-action]');if(!target||target.disabled)return;const [a,arg]=target.dataset.action.split(':');if(a==='go'){page=arg;render();return}if(a==='settings'){settings();return}if(a==='closeSettings'){const d=document.getElementById('settings');folder=d.querySelector('#folder-value').value.trim()||'~/Downloads/Media Parser';model=d.querySelector('#model-value').value.trim()||'My model';d.close();render();return}const s=states[page];if(!s)return;if(a==='new'){if(busy(s))return;const h=s.history;if(s.url||s.file||s.text){const snapshot={...s};delete snapshot.history;h.unshift(snapshot)}states[page]={...fresh(),history:h.slice(0,10),outputLang:lang};render()}else if(a==='restore'){if(busy(s))return;const h=s.history[Number(arg)];if(!h)return;const history=s.history.slice();if(s.url||s.file||s.text){const snapshot={...s};delete snapshot.history;history.push(snapshot)}states[page]={...h,history};render()}else if(a==='example'){if(busy(s))return;s.error='';s.status='idle';s.result='';if(page==='outline'){s.text=words[lang].transcript;s.title=t('sampleTitle');s.outputLang=lang}else if(page==='stt'){if(s.mode==='file')s.file='creative-practice-demo.mp3';else s.url='https://example.com/demo-audio.mp3'}else{s.url='https://example.com/'+(page==='video'?'watch/demo':'episode/demo');s.resolved=false}render()}else if(a==='parse')start(s,'parse');else if(a==='download'){s.downloadFormat=arg;start(s,'download')}else if(a==='start')start(s,'stt');else if(a==='generate')start(s,'outline');else if(a==='finish')finish(s);else if(a==='fail'){if(s.status==='running'){s.status='failed';render()}}else if(a==='stop'){if(busy(s)){s.status='cancelled';render()}}else if(a==='pause'){if(s.operation==='download'&&s.status==='running'){s.status='paused';render()}}else if(a==='resume'){if(s.status==='paused'){s.status='running';render()}}else if(a==='retry')start(s,s.operation);else if(a==='format'){s.audioKind=arg;render()}else if(a==='mode'){s.mode=arg;s.status='idle';s.error='';s.result='';render()}else if(a==='result'){s.view=arg;render()}else if(a==='pickAudio')document.getElementById('audio-file').click();else if(a==='pickText')document.getElementById('text-file').click();else if(a==='folder')notify('folderHint');else if(a==='copy'){try{await navigator.clipboard.writeText(s.result);notify('copied')}catch{notify('copyFallback')}}else if(a==='export'){const blob=new Blob([s.result],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=(page==='outline'?'outline-demo':'transcript-demo')+'.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
setInterval(()=>{let changed=false;for(const s of Object.values(states)){if(s.status==='running'&&s.progress<88){s.progress=Math.min(88,s.progress+7);if(states[page]===s)changed=true}}if(changed){const bar=document.querySelector('.progress i');if(bar)bar.style.width=states[page].progress+'%';const label=document.querySelector('.status-box .row>span:last-child');if(label)label.textContent=states[page].progress+'%'}},1500);
render();
</script>
</body></html>
