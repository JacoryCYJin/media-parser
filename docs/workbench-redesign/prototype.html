let lang='zh',view='video',panel=innerWidth>780,connection='signedOut',folder='~/Downloads/Media Parser',mode='browser',modelName='我的模型连接',counter=10,toastTimer;
const t=k=>labels[k]?.[lang==='zh'?0:1]||k;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={video:'M3 5h18v14H3z m6 4 6 3-6 3z',podcast:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0z M5 10v2a7 7 0 0 0 14 0v-2M12 19v3',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2',leaf:'M20 3C8 2 3 8 5 15s15 4 15-12z M5 20 15 9',plus:'M12 5v14M5 12h14',close:'m6 6 12 12M6 18 18 6',arrow:'M5 12h14m-5-5 5 5-5 5',history:'M4 8a8 8 0 1 1-1 7M3 3v6h6M12 7v5l3 2',doc:'M5 3h10l4 4v14H5z M14 3v5h5M8 12h8m-8 4h6',panel:'M3 4h18v16H3z M15 4v16'};const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[k]||icons.doc}"/></svg>`;const btn=(k,a,cls='',i='')=>`<button class="btn ${cls}" data-action="${a}">${i?icon(i):''}${t(k)}</button>`;
function seedMedia(kind){return{kind,input:kind==='video'?'https://example.com/city-walk':'',error:'',source:kind==='video'?{id:'s1',title:'城市漫游：重新发现日常生活',url:'https://example.com/city-walk',author:'日常观察',duration:'18:42'}:null,text:'',outline:'',jobs:[]}}
let media={video:seedMedia('video'),podcast:seedMedia('podcast')};let chats=[{id:'c1',draft:'',context:null,turns:[]}],chatId='c1';const chat=()=>chats.find(x=>x.id===chatId);const current=()=>media[view];

function attach(){const m=current();if(!m?.source){toast('noCurrent');return}chat().context={kind:view,title:m.source.title,url:m.source.url,text:m.text,outline:m.outline};panel=true;render();toast('ready')}

function mediaPage(){const m=current(),s=m.source;return `<header><h1>${t(view)}</h1><p>${t('subtitle')}</p></header><form id="parseform"><div class="inputbar"><input id="media-input" aria-label="${t('input')}" value="${esc(m.input)}" placeholder="${t('placeholder')}"><button class="btn primary" type="submit">${t('parse')}${icon('arrow')}</button></div></form><button class="smallaction" data-action="sample">${t('sample')}</button>${m.error?`<p role="alert" class="error">${t(m.error)}</p>`:''}${!s?`<div class="empty">${icon(view)}<p>${t('empty')}</p></div>`:`<section class="source"><div class="sourcehead"><div class="cover">${icon(view)}</div><div><small>${t(view)} · ${t('demo')}</small><h2>${esc(s.title)}</h2><small>${esc(s.author)} · ${s.duration}</small></div></div><p>${lang==='zh'?'放慢脚步，重新观察熟悉的事物。这里用虚构内容演示解析、文字整理与 AI 协作。':'Slow down and notice familiar things. Fictional content illustrates parsing, text processing and AI assistance.'}</p><div class="link">${t('source')} · ${esc(s.url)}</div>${view==='podcast'?`<div class="details"><h3>${t('playing')}</h3><audio controls class="audio" preload="none" aria-label="${t('playing')}"></audio><p class="note">${t('audioNote')}</p></div>`:''}<div class="formats">${(view==='video'?['1080p · MP4','720p · MP4','M4A']:['M4A']).map((f,i)=>`<div class="format"><div class="grow"><strong>${esc(f)}</strong><small>${view==='video'&&i<2?['142 MB','83 MB'][i]:'28 MB'} · ${t('demo')}</small></div>${btn('download','start:download:'+f)}${(view==='podcast'||i===2)?btn('transcribe','start:transcribe'):''}</div>`).join('')}</div><details class="details" ${m.text?'open':''}><summary>${t('text')}</summary><div class="textbody">${esc(m.text||t('needText'))}</div><div class="actions">${btn('transcribe','start:transcribe')}${m.text?btn('outline','start:outline'):''}${m.text?btn('sendToCodex','attach'):''}</div></details>${m.outline?`<details class="details" open><summary>${t('outlineTitle')}</summary><div class="textbody">${esc(m.outline)}</div>${btn('sendToCodex','attach')}</details>`:''}<div class="actions">${btn('sendToCodex','attach','','leaf')}</div>${processing(m)}</section>`}`}
function settings(){return `<header><h1>${t('settings')}</h1><p>${t('settingsNote')}</p></header><label class="field"><span>${t('language')}</span><select id="lang"><option value="zh" ${lang==='zh'?'selected':''}>简体中文</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></label><section class="settingsblock"><h2>${t('connection')}</h2><p class="note">${t('connectNote')}</p><label class="field"><span>${t('state')}</span><select id="connection">${['signedOut','connected','limited'].map(k=>`<option value="${k}" ${connection===k?'selected':''}>${t(k)}</option>`).join('')}</select></label>${connection==='signedOut'?btn('connect','connect','primary'):''}<p class="note">${t('apiNote')}</p></section><section class="settingsblock"><h2>${t('general')}</h2><label class="field"><span>${t('folder')}</span><input id="folder" value="${esc(folder)}"></label><div class="settings-grid"><label class="field"><span>${t('loginMode')}</span><select id="mode">${['browser','manual','none'].map(k=>`<option value="${k}" ${mode===k?'selected':''}>${t(k)}</option>`).join('')}</select></label><label class="field"><span>${t('modelName')}</span><input id="model" value="${esc(modelName)}"></label></div>${btn('save','save')}</section>`}
function aiTurn(x){return `<article class="message"><div class="user">${esc(x.prompt)}</div>${x.context?`<div class="attachment">${icon('doc')} ${esc(x.context.title)}</div>`:''}<div class="answerlabel">${icon('leaf')} Codex · ${t(x.status)}</div>${x.status==='completed'?`<div class="answer">${esc(x.answer)}</div><div class="chat-actions">${btn('copy','copy:'+x.id)}</div>`:x.status==='awaiting'?`<p>${t('approvalNote')}</p><div class="chat-actions">${btn('allow','allow:'+x.id)}${btn('deny','deny:'+x.id)}</div>`:x.status==='failed'?`<p>${t('failedNote')}</p>${btn('retry','chatRetry:'+x.id)}`:['stopped','declined'].includes(x.status)?btn('retry','chatRetry:'+x.id):''}<details class="process"><summary>${t('details')}</summary><p>${t('fixed')}<br>${esc(x.context?.title||t('noContext'))}</p>${x.status==='running'?`<div class="task-actions">${btn('finish','chatFinish:'+x.id)}${btn('fail','chatFail:'+x.id)}${btn('ask','chatAsk:'+x.id)}</div>`:''}</details></article>`}
function codex(){const c=chat(),active=c.turns.some(x=>['running','awaiting'].includes(x.status));return `<aside class="codex" ${panel?'':'hidden'} aria-label="${t('codex')}"><header class="codexhead between"><strong class="row">${icon('leaf')} Codex</strong><div class="row"><button class="icon" data-action="newChat" aria-label="${t('newChat')}" title="${t('newChat')}">${icon('plus')}</button><button class="icon" data-action="history" aria-label="${t('history')}" title="${t('history')}">${icon('history')}</button><button class="icon" data-action="panel" aria-label="${t('close')}">${icon('close')}</button></div></header><div class="conversation" aria-live="polite">${c.turns.length?c.turns.map(aiTurn).join(''):`<div class="chatempty">${icon('leaf')}<h3>${t('chatIntro')}</h3><p>${t('chatSub')}</p></div>`}</div><div class="composer">${connection!=='connected'?`<div class="connection-note">${t(connection==='limited'?'limitedNote':'loginNote')} <button data-action="goSettings">${t('settings')}</button></div>`:''}<div class="composebox">${c.context?`<div class="contextchip"><span>${icon('doc')} ${esc(c.context.title)}</span><button data-action="removeContext" aria-label="${t('remove')}">×</button></div>`:''}<textarea id="prompt" aria-label="${t('prompt')}" placeholder="${t('promptHint')}">${esc(c.draft)}</textarea><div class="between"><button class="addcurrent" data-action="attach" ${view==='settings'?'disabled':''}>${icon('plus')} ${t('sendCurrent')}</button>${active?btn('stop','chatStop'): `<button class="btn primary" data-action="send" ${connection!=='connected'?'disabled':''}>${t('send')}${icon('arrow')}</button>`}</div></div><small>${t('demoNote')}</small></div></aside>`}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand row">${icon('leaf')}<span>Media Parser</span></div><div class="sidehead">${t('modules')}</div><nav class="nav" aria-label="${t('modules')}">${['video','podcast'].map(k=>`<button class="${view===k?'on':''}" data-action="nav:${k}" aria-label="${t(k)}">${icon(k)}<span>${t(k)}</span></button>`).join('')}</nav><div class="sidebottom nav"><button class="${view==='settings'?'on':''}" data-action="nav:settings" aria-label="${t('settings')}">${icon('settings')}<span>${t('settings')}</span></button></div></aside><section class="shell"><header class="top between"><div><span class="muted">${t('workspace')} /</span>${t(view)}</div><div class="row"><span class="pill">${t('demo')}</span><button class="icon" data-action="panel" aria-label="${t('codex')}" aria-expanded="${panel}">${icon('panel')}</button></div></header><div class="layout ${panel?'':'closed'}"><main class="main">${view==='settings'?settings():mediaPage()}</main>${codex()}</div><footer class="footer between"><span>${t('demoNote')} <span class="extra">· ${t('memory')}</span></span><button data-action="reset">${t('reset')}</button></footer></section></div>`}
function loadSource(url,sample=false){const m=current();m.error='';m.text='';m.outline='';m.jobs=[];m.input=url;m.source={id:'s'+counter++,url,title:sample?(view==='video'?'城市漫游：重新发现日常生活':'慢慢来 · 关于创作与记录'):new URL(url).hostname+' · '+t('demo'),author:sample?(view==='video'?'日常观察':'慢慢来'):t('demo'),duration:view==='video'?'18:42':'48:26'};render()}
document.addEventListener('input',e=>{const el=e.target;if(el.id==='media-input')current().input=el.value;if(el.id==='prompt')chat().draft=el.value;if(el.id==='folder')folder=el.value;if(el.id==='model')modelName=el.value});document.addEventListener('change',e=>{if(e.target.id==='lang'){lang=e.target.value;render()}if(e.target.id==='connection'){connection=e.target.value;render()}if(e.target.id==='mode')mode=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id!=='parseform')return;e.preventDefault();try{const u=new URL(current().input);if(!['http:','https:'].includes(u.protocol))throw Error();loadSource(u.href)}catch{current().error='invalid';render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const [a,arg,...rest]=b.dataset.action.split(':');const c=chat();if(a==='nav'){view=arg;render()}else if(a==='panel'){panel=!panel;render()}else if(a==='goSettings'){view='settings';if(innerWidth<=780)panel=false;render()}else if(a==='sample')loadSource(view==='video'?'https://example.com/city-walk':'https://example.com/podcast/07',true);else if(a==='attach')attach();else if(a==='removeContext'){c.context=null;render()}else if(a==='connect'){connection='connected';render()}else if(a==='save')toast('saved');else if(a==='close')document.getElementById('dialog').close();else if(a==='start'){const m=current();if(arg==='outline'&&!m.text){toast('needText');return}const format=rest.join(':');if(!m.jobs.some(j=>j.type===arg&&j.format===format&&['running','paused'].includes(j.status)))m.jobs.unshift({id:'j'+counter++,type:arg,format,status:'running'});render()}else if(['pause','resume','cancel','retry','finish','fail','jobPreview'].includes(a)){const m=current(),j=m.jobs.find(x=>x.id===arg);if(!j)return;if(a==='jobPreview'){modal('preview',`<p class="note">${t('fileNote')}</p><pre>${esc(j.type==='transcribe'?m.text:j.type==='outline'?m.outline:(j.format||'M4A'))}</pre>`);return}j.status={pause:'paused',resume:'running',cancel:'cancelled',retry:'running',finish:'completed',fail:'failed'}[a];if(a==='finish'&&j.type==='transcribe')m.text=t('transcriptBody');if(a==='finish'&&j.type==='outline')m.outline=t('outlineBody');render()}else if(a==='newChat'){const x={id:'c'+counter++,draft:'',context:null,turns:[]};chats.unshift(x);chatId=x.id;render()}else if(a==='history')modal('history',chats.map(x=>`<button class="historyrow" data-action="switchChat:${x.id}">${esc(x.turns[0]?.prompt||t('newChat'))}<small>${x.turns.length} · ${x.turns.length?t(x.turns.at(-1).status):t('empty')}</small></button>`).join(''));else if(a==='switchChat'){chatId=arg;document.getElementById('dialog').close();render()}else if(a==='send'){if(connection!=='connected')return;if(!c.draft.trim()){toast('required');return}c.turns.push({id:'t'+counter++,prompt:c.draft.trim(),context:c.context?{...c.context}:null,status:'running',answer:''});c.draft='';render();document.querySelector('.conversation').scrollTop=document.querySelector('.conversation').scrollHeight}else if(a==='chatStop'){const x=c.turns.find(x=>['running','awaiting'].includes(x.status));if(x)x.status='stopped';render()}else if(['chatFinish','chatFail','chatAsk','allow','deny','chatRetry','copy'].includes(a)){const x=c.turns.find(x=>x.id===arg);if(!x)return;if(a==='copy'){try{await navigator.clipboard.writeText(x.answer);toast('copied')}catch{modal('copy',`<p class="note">${t('copyFallback')}</p><pre>${esc(x.answer)}</pre>`)}return}if(a==='chatRetry'&&c.turns.some(y=>y.id!==x.id&&['running','awaiting'].includes(y.status)))return;if(['chatRetry','allow','chatFinish'].includes(a)&&connection!=='connected'){toast(connection==='limited'?'limitedNote':'loginNote');return}x.status={chatFinish:'completed',chatFail:'failed',chatAsk:'awaiting',allow:'running',deny:'declined',chatRetry:'running'}[a];if(a==='chatFinish')x.answer=t('answerBody');render()}else if(a==='reset')modal('reset',`<p class="note">${t('resetQuestion')}</p>${btn('notNow','close')}${btn('yes','confirmReset','primary')}`);else if(a==='confirmReset'){media={video:seedMedia('video'),podcast:seedMedia('podcast')};chats=[{id:'c1',draft:'',context:null,turns:[]}];chatId='c1';view='video';connection='signedOut';folder='~/Downloads/Media Parser';mode='browser';modelName='我的模型连接';panel=innerWidth>780;document.getElementById('dialog').close();render()}});
render();
</script></body></html>
